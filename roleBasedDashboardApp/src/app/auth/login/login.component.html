<div class="container-fluid ps-md-0">
  <div class="row g-0">
    <div class="d-none d-md-flex col-md-4 col-lg-6 bg-image">
      <!-- Carousel -->
      <div id="carouselExampleSlidesOnly" class="carousel slide" data-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img class="d-block w-100" src="assets/image1.png" alt="First slide" style="height: 500px;">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100" src="assets/image2.png" alt="Second slide" style="height: 500px;">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100" src="assets/image3.png" alt="Third slide" style="height: 500px;">
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-8 col-lg-6">
      <div class="login d-flex align-items-center py-5">
        <div class="container">
          <div class="row">
            <div class="col-md-9 col-lg-8 mx-auto">
              <a href="#">
                <img src="assets/MM.png" alt="Logo" width="250" height="100" class="mb-4">
              </a>
              <p class="text-muted h5 text-center">Welcome to management services<br><small>by Emdep</small></p>
              <br>

              <!-- Card for Sign In Form -->
              <div class="card shadow">
                <div class="card-body">
<form [formGroup]="loginForm" (ngSubmit)="onLogin()">
  <div class="form-floating mb-3">
    <input
      type="text"
      class="form-control"
      id="floatingUsername"
      placeholder="Username"
      formControlName="username"
      [ngClass]="{ 'is-invalid': submitted && f['username'].errors }"
    />
    <label for="floatingUsername">Username</label>
  </div>

  <div class="form-floating mb-3">
    <input
      type="password"
      class="form-control"
      id="floatingPassword"
      placeholder="Password"
      formControlName="password"
      [ngClass]="{ 'is-invalid': submitted && f['password'].errors }"
    />
    <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
      <div *ngIf="f['password'].errors['required']">Mot de passe requis</div>
      <div *ngIf="f['password'].errors['minlength']">
        Mot de passe trop court (min 6 caractères)
      </div>
    </div>
    <label for="floatingPassword">Password</label>
  </div>

  <div class="d-grid">
  <button type="submit" class="btn btn-lg btn-primary">Sign in</button>
  </div>
</form>

              </div>
              <!-- End of Card -->

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
